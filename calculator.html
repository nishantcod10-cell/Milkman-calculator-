<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milkman Moo - Monthly Bill Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="hin">
    <div id="cow" class="cow" aria-hidden="true">🐮</div>
    <div><h1>Milkman Moo</h1><p id="mood">Log the litres and the bill sorts itself out.</p></div>
    <nav class="mn">
      <button id="prev" aria-label="Previous month">◀</button>
      <strong id="monthLabel"></strong>
      <button id="next" aria-label="Next month">▶</button>
      <a class="btnlink" href="index.html">🏠 Home</a>
      <button id="theme" class="ghost" aria-label="Toggle dark mode">🌙</button>
    </nav>
  </div>
  <div class="bike" aria-hidden="true">🚲🥛</div>
</header>

<main>
<section class="card">
  <div class="legend noprint">
    <span><i class="dot ok"></i>Delivered</span><span><i class="dot miss"></i>Missed (0 L)</span>
    <span><i class="dot late"></i>Late 🐌</span><span><i class="dot"></i>Not logged yet</span><span>☀️ Sunday</span>
  </div>
  <div id="cal" class="cal"></div>
  <div class="btns noprint">
    <label class="inl">Default L<input id="defL" type="number" min="0" step="0.5" value="1"></label>
    <button id="fill">Fill empty days up to today</button>
    <button id="sundays">Sundays off</button>
    <button id="reset" class="ghost">Reset month</button>
  </div>
</section>

<aside>
  <section class="card settings noprint">
    <h2>Setup</h2>
    <label class="wide">Vendor name<input id="vendor" placeholder="e.g. Ramesh Dairy"></label>
    <label>Rate / litre (₹)<input id="rate" type="number" min="0" step="0.5" value="56"></label>
    <label>Advance paid (₹)<input id="advance" type="number" min="0" placeholder="0"></label>
    <label>New rate (₹)<input id="newRate" type="number" min="0" step="0.5" placeholder="if it changed"></label>
    <label>New rate from day<input id="newFrom" type="number" min="1" max="31" placeholder="e.g. 15"></label>
    <div class="paper wide">
      <label class="chk"><input id="paperOn" type="checkbox"> 📰 Add newspaper</label>
      <label>Per day (₹)<input id="paperRate" type="number" min="0" step="0.5" value="5"></label>
      <label>Sunday (₹)<input id="sunRate" type="number" min="0" step="0.5" placeholder="same as normal"></label>
    </div>
  </section>

  <section class="card bill">
    <div class="glass" aria-hidden="true"><div id="milk"></div></div>
    <div class="receipt">
      <h2 id="billTitle">Bill</h2>
      <dl class="stats">
        <dt>Total litres</dt><dd id="tLitres">0</dd>
        <dt>Delivered days</dt><dd id="tDel">0</dd>
        <dt>Days missed</dt><dd id="tMiss">0</dd>
        <dt>Days late</dt><dd id="tLate">0</dd>
        <dt>Not logged</dt><dd id="tPend">0</dd>
        <dt>Avg per delivery</dt><dd id="tAvg">0 L</dd>
      </dl>
      <dl id="lines" class="lines"></dl>
      <dl>
        <dt class="big">Total bill</dt><dd class="big" id="tTotal">₹0</dd>
        <dt>Advance paid</dt><dd id="tAdv">₹0</dd>
        <dt class="big">Balance due</dt><dd class="big" id="tDue">₹0</dd>
      </dl>
    </div>
    <div class="btns noprint wide">
      <button id="print">Print</button>
      <button id="copy">Copy for WhatsApp</button>
      <button id="csv" class="ghost">Download CSV</button>
      <p id="toast"></p>
    </div>
  </section>
</aside>
</main>
<script src="js/app.js"></script>
</body>
</html>
